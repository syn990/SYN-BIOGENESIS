# The program built and checked with make test on Linux and on Windows
# (MSYS2's UCRT64), its JVM checks on Java 27; the comparisons with the jars
# need tools/javaref/fetch.sh, which this does not run. The Windows run keeps
# dist/syn-biogenesis/, the program with its DLLs and assets, as a download.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - run: make -j4
      - run: make -j4 test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_image
      - run: make -j4
      - name: make test
        run: |
          export PATH="$(cygpath -u "$JAVA_HOME")/bin:$PATH"
          make -j4 test
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: syn-biogenesis-windows-x86_64
          path: dist/
